<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Wotan logo">
  <!-- Original mark: a stylized raven's eye (Wotan / Odin, the all-seeing).
       The pupil is a raven silhouette facing right. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <!-- almond eye outline -->
  <path d="M4 32 C 16 12, 48 12, 60 32 C 48 52, 16 52, 4 32 Z"
        fill="none" stroke="url(#g)" stroke-width="4" stroke-linejoin="round"/>
  <!-- iris -->
  <circle cx="32" cy="32" r="13" fill="url(#g)"/>
  <!-- raven silhouette as the pupil: body + head + beak -->
  <path d="M27 38 C 26 33, 28 29, 32 28 C 31 26, 32 24, 34 24 C 34 23, 35 23, 35.5 23.5
           L 39 25 L 35.5 26 C 36 28, 35.5 30, 34 31 C 37 32, 38 35, 37 38
           C 34 39.5, 30 39.5, 27 38 Z" fill="#1a1b26"/>
  <circle cx="33.6" cy="25.4" r="0.9" fill="#7aa2f7"/>
</svg>
